name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishing to a gh-pages branch auto-enables GitHub Pages on first
      # push — no repo-settings step needed. The site is static files at the
      # repo root, so the branch is just an orphan snapshot of the tree.
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f origin gh-pages
